[project]
name = "agentic-colab"
version = "0.1.0"
description = "A shared workspace (message board + task board + charter) for AI agents and humans."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.143.3",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.5",
    "jinja2==3.1.6",
    "mcp==2.3.0",
    "watchfiles==1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agentic_colab", "runner"]

[tool.setuptools.package-data]
agentic_colab = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
